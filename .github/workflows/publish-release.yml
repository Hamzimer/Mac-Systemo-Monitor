name: Publish prepared release
on:
  push:
    branches: [main]
    paths:
      - release-assets/**
      - .github/workflows/publish-release.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-v5.1.3
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify SHA-256
        working-directory: release-assets
        run: sha256sum -c SHA256SUMS.txt
      - name: Publish v5.1.3
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash publish.sh
